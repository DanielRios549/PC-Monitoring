{{define "components/ap/list"}}
<ul class="ap-list">
    {{range $ap := .}}
        <li>
            <a href="/access-points/{{$ap.ID}}">{{$ap.Hostname}}</a>
            <span>{{$ap.Devices}} Devices</span>
        </li>
    {{end}}
</ul>

<style>
    @layer component {
        ul.ap-list {
            li {
                border-bottom: 2px solid var(--text);
            }
            li, p {
                color: var(--text);
            }
        }
    }
</style>
{{end}}
