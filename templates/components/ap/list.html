{{define "components/ap/list"}}
<ul class="ap-list">
    {{range $ap := .}}
        <li class="card">
            <a href="/access-points/{{$ap.ID}}">{{$ap.Hostname}}</a>
            <span>{{$ap.Devices}} Devices</span>
        </li>
    {{end}}
</ul>

<style>
    @layer component {
        ul.ap-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;

            li {
                height: 200px;
                width: 250px;
            }
            li, p {
                color: var(--text);
            }
        }
    }
</style>
{{end}}
