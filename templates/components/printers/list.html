{{define "components/printers/list"}}
<ul class="printer-list">
    {{range $printer := .}}
        <li class="card">
            <a href="/printers/{{$printer.ID}}">{{$printer.Hostname}}</a>
        </li>
    {{end}}
</ul>

<style>
    @layer component {
        ul.printer-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;

            li {
                height: 200px;
                width: 250px;
            }
            li, p {
                color: var(--text);
            }
        }
    }
</style>
{{end}}
