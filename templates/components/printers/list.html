{{define "components/printers/list"}}
<ul>
    {{range $printer := .}}
        <li>
            {{range $info := $printer}}
                <p>{{$info.Name}}: <span>{{$info.Value}}</span></p>
            {{end}}
        </li>
    {{end}}
</ul>

<style>
    @layer component {
        li {
            border-bottom: 2px solid var(--text);
        }
    }
</style>
{{end}}
