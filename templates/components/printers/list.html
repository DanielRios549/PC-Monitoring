{{define "components/printers/list"}}
<ul class="printer-list">
    {{range $printer := .}}
        <li>
            <a href="/printers/{{$printer.Hostname}}">{{$printer.Hostname}}</a>
        </li>
    {{end}}
</ul>

<style>
    @layer component {
        ul.printer-list {
            li {
                border-bottom: 2px solid var(--text);
            }
            li, p {
                color: var(--text);
            }
        }
    }
</style>
{{end}}
