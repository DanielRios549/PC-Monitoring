<button @click="toggle()">Theme</button>

<style>
    @layer component {
        nav#main-nav {
            max-height: 90vh;
            margin-top: 7rem;

            ul {
                display: flex;
                flex-direction: column;
                align-items: flex-start;

                li.active {
                    background-color: var(--progress);
                    border-radius: 0.4rem;
                    border-color: var(--accent);
                }
                li {
                    border-left: 0.3rem solid transparent;
                    display: flex;
                    padding-left: 1rem;
                    align-items: center;
                    gap: 1rem;
                    width: 100%;
                    height: 3rem;

                    svg {
                        --size: 32px;
                        width: var(--size);
                        height: var(--size);
                    }
                    a {
                        display: flex;
                        align-items: center;
                        height: 100%;
                        width: 100%;
                        text-decoration: none;
                        color: var(--text);
                    }
                }
            }
        }
    }
</style>
{{end}}
