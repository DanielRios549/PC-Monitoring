<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hardware Monitor</title>
        <link rel="stylesheet" href="/style.css"/>
        <script defer async src="/script.js"></script>
    </head>
    <body>
        <h1>SYSTEM MONITOR</h1>
        <div class="grid">
            <!-- CPU Section -->
            <div class="card">
                <h2>CPU Usage</h2>
                <div id="cpu-container" class="cpu-grid">Loading cores...</div>
            </div>
            <!-- RAM Section -->
            <div class="card">
                <h2>Memory (RAM)</h2>
                <div id="ram-container">Loading Memory...</div>
            </div>
            <!-- GPU Section -->
            <div class="card">
                <h2>GPU & VRAM</h2>
                <div id="gpu-container">Loading GPUs...</div>
            </div>
            <!-- Disk Section -->
            <div class="card">
                <h2>Storage (Disks)</h2>
                <div id="disk-list"></div>
            </div>
        </div>
    </body>
</html>
