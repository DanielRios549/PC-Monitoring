<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>{{.Header.Title}}</title>
        <meta name="description" content="{{.Header.Description}}">

        <link rel="icon" href="/icon.png">
        <link rel="stylesheet" href="/style.css"/>
        <script defer async src="/script.js"></script>

        <!-- V4 Beta 6 -->
        <script defer async src="/libs/htmx.js"></script>
        <!-- V3.15.12 -->
        <script defer async src="/libs/alpine.js"></script>
    </head>
    <body x-data :class="$store.theme.current">
        <header>
            <h1>PC MONITORING</h1>
            <button x-data @click="$store.theme.toggle()">Theme</button>
        </header>
        <main class="grid">
            <!-- CPU Section -->
            <section class="card" hx-post="/cpu" hx-target="#cpu-container" hx-trigger="every 1s">
                <h2>CPU Usage <span class="card-name">{{.Info.CPU.Name}}</span></h2>
                <article id="cpu-container">Loading cores...</article>
            </section>
            <!-- RAM Section -->
            <section class="card" hx-post="/memory" hx-target="#ram-container" hx-trigger="every 2s">
                <h2>Memory (RAM)</h2>
                <article id="ram-container">Loading Memory...</article>
            </section>
            <!-- GPU Section -->
            <section class="card" hx-post="/gpu" hx-target="#gpu-container" hx-trigger="every 1s">
                <h2>GPU & VRAM</h2>
                <article id="gpu-container">Loading GPUs...</article>
            </section>
            <!-- Disk Section -->
            <section class="card" hx-post="/disk" hx-target="#disk-container" hx-trigger="load">
                <h2>Storage (Disks)</h2>
                <article id="disk-container"></article>
            </section>
        </main>
    </body>
</html>
